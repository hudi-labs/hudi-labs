<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Tailwind CSS -->

                    "colors": {

                        "primary-fixed": "#d9e2ff",
                        "secondary-fixed-dim": "#6de039",
                        "on-tertiary-fixed-variant": "#614000",
                        "on-tertiary-fixed": "#281800",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f0f1f2",
                        "on-surface-variant": "#414755",
                        "surface": "#f8f9fa",
                        "tertiary-container": "#9d6a00",
                        "on-error": "#ffffff",
                        "background": "#f8f9fa",
                        "on-primary": "#ffffff",
                        "primary-container": "#006ef2",
                        "on-tertiary": "#ffffff",
                        "secondary": "#266d00",
                        "secondary-fixed": "#88fd54",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f8f9fa",
                        "tertiary-fixed-dim": "#ffba45",
                        "secondary-container": "#85fa51",
                        "surface-variant": "#e1e3e4",
                        "on-primary-fixed": "#001a43",
                        "on-primary-container": "#fefcff",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d9dadb",
                        "on-secondary-fixed": "#062100",
                        "inverse-primary": "#afc6ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#1a5200",
                        "surface-tint": "#0059c7",
                        "surface-container-high": "#e7e8e9",
                        "primary": "#0057c2",
                        "surface-container": "#edeeef",
                        "primary-fixed-dim": "#afc6ff",
                        "tertiary-fixed": "#ffddb0",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-highest": "#e1e3e4",
                        "outline": "#727786",
                        "outline-variant": "#c1c6d7",
                        "on-surface": "#191c1d",
                        "on-primary-fixed-variant": "#004398",
                        "on-secondary": "#ffffff",
                        "tertiary": "#7d5400",
                        "on-tertiary-container": "#fffbff",
                        "on-background": "#191c1d",
                        "on-secondary-container": "#287100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",

                    },
                    "spacing": {

                        "gutter": "16px",
                        "container-max": "1024px",
                        "xs": "4px",
                        "md": "16px",

                        "base": "4px",

                    },
                    "fontFamily": {

                        "display-lg-mobile": ["Inter"],

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* Utility to handle safe area on iOS devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Subtle custom styling for the input to remove default webkit appearance */
        input[type="tel"]::-webkit-outer-spin-button,
        input[type="tel"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="tel"] {
            -moz-appearance: textfield;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-surface antialiased text-on-surface">
    <!-- Screen Wrapper: Centered on desktop, full height on mobile -->
    <div class="min-h-screen flex items-center justify-center p-0 md:p-md">
        <!-- Main Application Card / Mobile Screen -->
        <div
            class="w-full h-screen md:h-auto md:min-h-[640px] max-w-[480px] bg-surface-container-lowest flex flex-col md:rounded-xl md:shadow-lg relative overflow-hidden">
            <!-- Contextual Header (Transactional - No standard TopAppBar) -->
            <header class="h-[56px] px-md flex items-center w-full z-10 bg-surface-container-lowest">
                <button aria-label="Voltar"
                    class="w-[40px] h-[40px] flex items-center justify-center rounded-full hover:bg-surface-container-low active:bg-surface-container-high transition-colors">
                    <span class="material-symbols-outlined text-on-surface text-[24px]">arrow_back</span>
                </button>
            </header>
            <!-- Main Content Area -->
            <main class="flex-1 flex flex-col px-md pt-lg pb-md">
                <!-- Typography Section -->
                <div class="mb-xl">
                    <h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface mb-sm">
                        Entrar com seu celular
                    </h1>
                    <p class="text-body-lg font-body-lg text-on-surface-variant">
                        Enviaremos um código de 6 dígitos para confirmar seu número
                    </p>
                </div>
                <!-- Input Section -->
                <div class="flex flex-col gap-sm mt-md">
                    <label class="sr-only" for="phone-input">Número de celular</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
                            <span class="text-body-lg font-body-lg text-on-surface-variant mr-xs">+55</span>
                        </div>
                        <input autocomplete="tel"
                            class="block w-full pl-[52px] pr-md py-[14px] text-headline-sm font-headline-sm text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-surface-dim"
                            id="phone-input" maxlength="15" placeholder="(00) 00000-0000" type="tel" />
                    </div>
                </div>
                <!-- Spacer to push button to bottom on mobile if content is short -->
                <div class="flex-1"></div>
                <!-- Action Section -->
                <div class="mt-xl pb-safe">
                    <button
                        class="w-full bg-primary text-on-primary h-[56px] rounded-full text-label-md font-label-md flex items-center justify-center hover:bg-surface-tint active:scale-[0.98] transition-all shadow-sm">
                        Receber código por SMS
                    </button>
                </div>
            </main>
        </div>
    </div>
    <script>
        // Simple mask logic for visual feedback on input
        const phoneInput = document.getElementById('phone-input');

        phoneInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits

            if (value.length > 0) {
                if (value.length <= 2) {
                    value = `(${value}`;
                } else if (value.length <= 7) {
                    value = `(${value.substring(0, 2)}) ${value.substring(2)}`;
                } else {
                    value = `(${value.substring(0, 2)}) ${value.substring(2, 7)}-${value.substring(7, 11)}`;
                }
            }
            e.target.value = value;
        });
    </script>
</body>

</html>
