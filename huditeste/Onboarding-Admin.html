<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin - Cadastrar estabelecimento</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2e3132",
                        "primary-fixed": "#d9e2ff",
                        "secondary-fixed-dim": "#6de039",
                        "on-tertiary-fixed-variant": "#614000",
                        "on-tertiary-fixed": "#281800",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f0f1f2",
                        "on-surface-variant": "#414755",
                        "surface": "#f8f9fa",
                        "tertiary-container": "#9d6a00",
                        "on-error": "#ffffff",
                        "background": "#f8f9fa",
                        "on-primary": "#ffffff",
                        "primary-container": "#006ef2",
                        "on-tertiary": "#ffffff",
                        "secondary": "#266d00",
                        "secondary-fixed": "#88fd54",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f8f9fa",
                        "tertiary-fixed-dim": "#ffba45",
                        "secondary-container": "#85fa51",
                        "surface-variant": "#e1e3e4",
                        "on-primary-fixed": "#001a43",
                        "on-primary-container": "#fefcff",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d9dadb",
                        "on-secondary-fixed": "#062100",
                        "inverse-primary": "#afc6ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#1a5200",
                        "surface-tint": "#0059c7",
                        "surface-container-high": "#e7e8e9",
                        "primary": "#0057c2",
                        "surface-container": "#edeeef",
                        "primary-fixed-dim": "#afc6ff",
                        "tertiary-fixed": "#ffddb0",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-highest": "#e1e3e4",
                        "outline": "#727786",
                        "outline-variant": "#c1c6d7",
                        "on-surface": "#191c1d",
                        "on-primary-fixed-variant": "#004398",
                        "on-secondary": "#ffffff",
                        "tertiary": "#7d5400",
                        "on-tertiary-container": "#fffbff",
                        "on-background": "#191c1d",
                        "on-secondary-container": "#287100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "gutter": "16px",
                        "container-max": "1024px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "base": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-lg": ["38px", { "lineHeight": "46px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]

                },
            },
        }

    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background text-on-background min-h-screen flex items-center justify-center p-md bg-gradient-to-br from-surface to-surface-container">
    <!-- Main Container - Transactional Onboarding Flow -->
    <!-- Note: TopAppBar, Drawer, and BottomNav are suppressed per the Semantic Shell Mandate for transactional screens -->
    <main
        class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-md border border-surface-variant p-lg sm:p-xl flex flex-col gap-xl relative overflow-hidden">
        <!-- Subtle Top Decoration for Brand Polish -->
        <div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
        <!-- Header -->
        <header class="flex flex-col items-center text-center gap-sm mt-sm">
            <div class="w-16 h-16 bg-primary-container/20 rounded-full flex items-center justify-center mb-xs">
                <span class="material-symbols-outlined text-[32px] text-primary"
                    style="font-variation-settings: 'FILL' 1;">add_business</span>
            </div>
            <h1 class="text-headline-md font-headline-md text-on-surface">Cadastrar estabelecimento</h1>
            <p class="text-body-md font-body-md text-on-surface-variant max-w-[320px]">
                Preencha os dados abaixo para registrar um novo parceiro na plataforma.
            </p>
        </header>
        <!-- Form -->
        <form action="#" class="flex flex-col gap-lg" method="POST">
            <div class="flex flex-col gap-md">
                <!-- Field: Nome do estabelecimento -->
                <div class="flex flex-col gap-xs">
                    <label class="text-label-md font-label-md text-on-surface" for="storeName">Nome do
                        estabelecimento</label>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none">storefront</span>
                        <input
                            class="w-full h-[48px] pl-10 pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant/70"
                            id="storeName" name="storeName" placeholder="Ex: Boutique de Carnes Silva" required=""
                            type="text" />
                    </div>
                </div>
                <!-- Field: Nome do responsável -->
                <div class="flex flex-col gap-xs">
                    <label class="text-label-md font-label-md text-on-surface" for="ownerName">Nome do
                        responsável</label>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none">person</span>
                        <input
                            class="w-full h-[48px] pl-10 pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant/70"
                            id="ownerName" name="ownerName" placeholder="Ex: Carlos Augusto" required="" type="text" />
                    </div>
                </div>
                <!-- Field: E-mail do usuário master -->
                <div class="flex flex-col gap-xs">
                    <label class="text-label-md font-label-md text-on-surface" for="masterEmail">E-mail do usuário
                        master</label>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none">mail</span>
                        <input
                            class="w-full h-[48px] pl-10 pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant/70"
                            id="masterEmail" name="masterEmail" placeholder="contato@estabelecimento.com.br" required=""
                            type="email" />
                    </div>
                </div>
                <!-- Field: WhatsApp do estabelecimento -->
                <div class="flex flex-col gap-xs">
                    <label class="text-label-md font-label-md text-on-surface" for="whatsapp">WhatsApp do
                        estabelecimento</label>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none">call</span>
                        <input
                            class="w-full h-[48px] pl-10 pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant/70"
                            id="whatsapp" name="whatsapp" placeholder="(00) 90000-0000" required="" type="tel" />
                    </div>
                </div>
            </div>
            <!-- Actions -->
            <div class="flex flex-col gap-sm pt-sm mt-sm border-t border-surface-variant">
                <button
                    class="w-full h-[48px] bg-primary text-on-primary rounded-full text-label-md font-label-md flex items-center justify-center hover:bg-surface-tint active:scale-[0.98] transition-all shadow-sm group"
                    type="submit">
                    <span class="mr-sm">Cadastrar e gerar link</span>
                    <span
                        class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
                <button
                    class="w-full h-[48px] bg-transparent text-primary rounded-full text-label-md font-label-md flex items-center justify-center hover:bg-surface-container transition-colors"
                    type="button">
                    Voltar para lista
                </button>
            </div>
        </form>
    </main>
</body>

</html>
