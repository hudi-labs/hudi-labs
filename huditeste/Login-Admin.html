<!DOCTYPE html>

<html class="light" lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Painel do Estabelecimento - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2e3132",
                        "primary-fixed": "#d9e2ff",
                        "secondary-fixed-dim": "#6de039",
                        "on-tertiary-fixed-variant": "#614000",
                        "on-tertiary-fixed": "#281800",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f0f1f2",
                        "on-surface-variant": "#414755",
                        "surface": "#f8f9fa",
                        "tertiary-container": "#9d6a00",
                        "on-error": "#ffffff",
                        "background": "#f8f9fa",
                        "on-primary": "#ffffff",
                        "primary-container": "#006ef2",
                        "on-tertiary": "#ffffff",
                        "secondary": "#266d00",
                        "secondary-fixed": "#88fd54",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f8f9fa",
                        "tertiary-fixed-dim": "#ffba45",
                        "secondary-container": "#85fa51",
                        "surface-variant": "#e1e3e4",
                        "on-primary-fixed": "#001a43",
                        "on-primary-container": "#fefcff",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d9dadb",
                        "on-secondary-fixed": "#062100",
                        "inverse-primary": "#afc6ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#1a5200",
                        "surface-tint": "#0059c7",
                        "surface-container-high": "#e7e8e9",
                        "primary": "#0057c2",
                        "surface-container": "#edeeef",
                        "primary-fixed-dim": "#afc6ff",
                        "tertiary-fixed": "#ffddb0",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-highest": "#e1e3e4",
                        "outline": "#727786",
                        "outline-variant": "#c1c6d7",
                        "on-surface": "#191c1d",
                        "on-primary-fixed-variant": "#004398",
                        "on-secondary": "#ffffff",
                        "tertiary": "#7d5400",
                        "on-tertiary-container": "#fffbff",
                        "on-background": "#191c1d",
                        "on-secondary-container": "#287100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "gutter": "16px",
                        "container-max": "1024px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "base": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-lg": ["38px", { "lineHeight": "46px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background text-on-background min-h-screen flex items-center justify-center p-md md:p-xl relative overflow-hidden">
    <!-- Abstract Decorative Background -->
    <div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
        <div
            class="absolute top-[-20%] right-[-10%] w-[500px] h-[500px] rounded-full bg-primary-fixed-dim blur-3xl mix-blend-multiply">
        </div>
        <div
            class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-secondary-fixed-dim blur-3xl mix-blend-multiply">
        </div>
    </div>
    <!-- Login Container -->
    <main class="w-full max-w-[440px] z-10 glass-panel rounded-xl shadow-lg p-lg md:p-xl flex flex-col gap-lg">
        <!-- Header -->
        <header class="text-center flex flex-col gap-sm">
            <!-- Brand Icon (Conceptual Placeholder) -->
            <div
                class="mx-auto w-12 h-12 bg-primary text-on-primary rounded-lg flex items-center justify-center shadow-md mb-sm">
                <span class="material-symbols-outlined text-headline-sm font-headline-sm"
                    style="font-variation-settings: 'FILL' 1;">
                    storefront
                </span>
            </div>
            <h1
                class="text-display-lg-mobile md:text-display-lg font-display-lg-mobile md:font-display-lg text-on-surface">
                Painel do estabelecimento
            </h1>
            <p class="text-body-md font-body-md text-on-surface-variant">
                Acesse sua conta para gerenciar pedidos e entregas.
            </p>
        </header>
        <!-- Form -->
        <form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
            <!-- Email Field -->
            <div class="flex flex-col gap-xs">
                <label class="text-label-md font-label-md text-on-surface" for="email">E-mail</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">
                        mail
                    </span>
                    <input
                        class="w-full h-10 md:h-12 pl-10 pr-3 border border-outline-variant rounded-lg bg-surface text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                        id="email" placeholder="contato@seuestabelecimento.com" type="email" />
                </div>
            </div>
            <!-- Password Field -->
            <div class="flex flex-col gap-xs">
                <div class="flex justify-between items-center">
                    <label class="text-label-md font-label-md text-on-surface" for="password">Senha</label>
                    <a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Esqueci a senha</a>
                </div>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">
                        lock
                    </span>
                    <input
                        class="w-full h-10 md:h-12 pl-10 pr-10 border border-outline-variant rounded-lg bg-surface text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                        id="password" placeholder="••••••••" type="password" />
                    <button
                        class="absolute right-3 text-on-surface-variant hover:text-on-surface focus:outline-none flex items-center justify-center"
                        id="togglePassword" type="button">
                        <span class="material-symbols-outlined text-[20px]" id="visibilityIcon">
                            visibility_off
                        </span>
                    </button>
                </div>
            </div>
            <!-- Submit Button -->
            <button
                class="w-full h-10 md:h-12 mt-sm bg-primary hover:bg-surface-tint text-on-primary text-label-md font-label-md rounded-lg shadow-sm transition-colors flex items-center justify-center gap-sm active:scale-[0.98]"
                type="submit">
                Entrar
                <span class="material-symbols-outlined text-[20px]">
                    login
                </span>
            </button>
        </form>
        <!-- Footer / Support -->
        <div class="mt-md text-center">
            <p class="text-label-sm font-label-sm text-on-surface-variant">
                Problemas para acessar? <a class="text-primary hover:underline" href="#">Fale com o suporte</a>
            </p>
        </div>
    </main>
    <script>
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        const visibilityIcon = document.getElementById('visibilityIcon');

        toggleButton.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            if (type === 'text') {
                visibilityIcon.textContent = 'visibility';
            } else {
                visibilityIcon.textContent = 'visibility_off';
            }
        });
    </script>
</body>

</html>
