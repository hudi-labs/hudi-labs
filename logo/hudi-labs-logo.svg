<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .text-hudi { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 46px; fill: #1E3A8A; }
      .text-labs { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 46px; fill: #64748B; }
    </style>
    
    <!-- Gradients for a 3D effect -->
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#213E93" />
      <stop offset="100%" stop-color="#102157" />
    </linearGradient>

    <!-- Mais fluido e suave -->
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Logo mark -->
  <!-- Dark Rectangle -->
  <rect x="20" y="15" width="28" height="70" fill="url(#darkGradient)" />
  
  <!-- Light Square with Shadow -->
  <g filter="url(#shadow)">
    <!-- Base Color com maior transparência -->
    <rect x="34" y="33" width="34" height="34" fill="url(#lightGradient)" opacity="0.65" />
  </g>
  
  <!-- Typography -->
  <text x="85" y="68" class="text-hudi">HUDI</text>
  <text x="220" y="68" class="text-labs">Labs</text>
</svg>
